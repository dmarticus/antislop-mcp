[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "antislop-mcp"
version = "0.1.0"
description = "MCP server for locally served Qwen3.8-27B-antislop"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "mcp>=1.30,<2", "pydantic>=2,<3"]

[project.scripts]
antislop-mcp = "antislop_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
